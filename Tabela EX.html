<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<style>
	
		table.tabela{
			border: solid 2px grey;
			background-color: lightgreen;
		}

		table.tabela caption{
			background-color: lightblue;
		}

		table.tabela td{
			border: solid 2px red;
			padding: 10px;
			text-align: 10px;
		}

	</style>
</head>
<body>
	<table class="tabela">
		<caption>Tabela de Geografia<caption>
		<tr><th>Região</th>	<th>Estado</th> <th>Capital</th></tr>
		<tr><td rowspan="3">Sul</td>	<td>SC</td>		<td>Floripa</td></tr>
		<tr>							<td>RS</td>		<td>Porto Alegre</td></tr>
		<tr>							<td>PR</td>		<td>Curitiba</td></tr>
		<tr><td rowspan="4">Sudeste</td><td>SP</td>		<td>São Paulo</td></tr>
		<tr>						<td>RJ</td>		<td>Rio de Janeiro</td></tr>
		<tr>						<td>MG</td>		<td>Belo Horizonte</td></tr>
		<tr>						<td>ES</td>		<td>Vitoria</td></tr>
		<tr><td>IFC</td>		<td>IFC</td>	<td>IFC</td></tr>
	</table>
</body>
</html>
